<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#070c1e" />
    </linearGradient>

    <!-- Logo Badge Gradient matching VehiclePro design system (#1F4E79 -> #5B9BD5) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E79" />
      <stop offset="100%" stop-color="#5B9BD5" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B9BD5" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5B9BD5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5B9BD5" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="28" />
  <circle cx="250" cy="180" r="160" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="125" y1="0" x2="125" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="275" y1="0" x2="275" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="425" y1="0" x2="425" y2="500" />
    <line x1="0" y1="75" x2="500" y2="75" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="225" x2="500" y2="225" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="375" x2="500" y2="375" />
    <line x1="0" y1="450" x2="500" y2="450" />
  </g>

  <!-- Status pill at top -->
  <g transform="translate(160, 48)">
    <rect width="180" height="30" rx="15" fill="#2E7D32" fill-opacity="0.18" stroke="#2E7D32" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="22" cy="15" r="5" fill="#4caf50" />
    <text x="36" y="20" fill="#a5d6a7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">FLEET ONLINE</text>
  </g>

  <!-- Central Brand Icon -->
  <g filter="url(#shadow)">
    <!-- Brand Box with border -->
    <rect x="180" y="110" width="140" height="140" rx="34" fill="url(#brandGrad)" stroke="#5B9BD5" stroke-opacity="0.5" stroke-width="2" />
    <!-- Stylized "V" Character -->
    <text x="250" y="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">V</text>
  </g>

  <!-- Car outline silhouette below logo -->
  <path d="M190 270 Q205 264 220 264 L280 264 Q295 264 310 270 L325 285 Q335 292 335 302 L335 308 Q335 312 330 312 L320 312 Q318 312 316 308 A 12 12 0 0 0 292 308 Q290 312 288 312 L212 312 Q210 312 208 308 A 12 12 0 0 0 184 308 Q182 312 180 312 L170 312 Q165 312 165 308 L165 302 Q165 292 175 285 Z" fill="#5B9BD5" fill-opacity="0.25" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Typography -->
  <text x="250" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VehiclePro</text>
  
  <text x="250" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2">VEHICLE MANAGEMENT SYSTEM</text>

  <!-- Bottom Badges / Tech tags -->
  <g transform="translate(65, 430)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="52.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Flutter Web</text>

    <rect x="115" y="0" width="115" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="172.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Spring Boot</text>

    <rect x="240" y="0" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="305" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
